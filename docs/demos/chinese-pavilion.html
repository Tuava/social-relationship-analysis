<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>月下水榭 · 中国凉亭</title>
<style>
  :root {
    color-scheme: dark;
    --ink:#04101c;
    --moon:#ffe9b8;
    --gold:#e9c26a;
    --red:#a8281f;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; overflow:hidden; }
  body {
    font-family:"Songti SC","Noto Serif SC","STSong",serif;
    color:#fff6e2;
    background:
      radial-gradient(circle at 74% 16%, rgba(255,205,130,.30), transparent 34%),
      radial-gradient(circle at 12% 88%, rgba(60,150,160,.18), transparent 50%),
      linear-gradient(180deg,#050b18 0%,#0d2036 46%,#274a58 74%,#123039 100%);
  }
  .scene{
    position:relative; width:100%; height:100%;
    perspective:1200px; cursor:crosshair;
  }
  /* ---------- sky ---------- */
  .sky{position:absolute;inset:0;z-index:1;}
  .moon{
    position:absolute; right:14%; top:10%;
    width:clamp(80px,10vw,140px); aspect-ratio:1; border-radius:50%;
    background:
      radial-gradient(circle at 32% 30%, rgba(0,0,0,.05) 0 8%, transparent 9%),
      radial-gradient(circle at 62% 58%, rgba(0,0,0,.04) 0 6%, transparent 7%),
      radial-gradient(circle at 40% 66%, rgba(0,0,0,.05) 0 5%, transparent 6%),
      radial-gradient(circle at 36% 34%, #fffdf4, var(--moon) 52%, #f0b867);
    box-shadow:
      inset -8px -10px 26px rgba(190,120,40,.25),
      0 0 44px #ffd98d,
      0 0 120px rgba(255,190,105,.45),
      0 0 260px rgba(255,175,90,.18);
    animation:moon-breathe 8s ease-in-out infinite alternate;
  }
  .cloud{
    position:absolute; height:16px; border-radius:999px;
    background:radial-gradient(ellipse at center, rgba(255,240,220,.16), transparent 70%);
    filter:blur(9px);
  }
  .cloud.c1{ right:6%; top:16%; width:220px; animation:mist-drift 17s ease-in-out infinite alternate; }
  .cloud.c2{ right:22%; top:7%; width:150px; animation:mist-drift 23s ease-in-out infinite alternate-reverse; }
  .stars{position:absolute; inset:0;}
  .stars i{
    position:absolute; display:block; border-radius:50%;
    background:#dff0ff; animation:twinkle 4s ease-in-out infinite;
  }
  /* ---------- landscape ---------- */
  .mountains{position:absolute; left:0; right:0; bottom:26%; height:34%; z-index:2; pointer-events:none;}
  .mountain{position:absolute; left:-4%; right:-4%; bottom:0;}
  .mountain.a{
    height:78%; opacity:.55; filter:blur(.4px);
    background:linear-gradient(180deg, rgba(52,88,110,.85), rgba(16,38,56,.95));
    clip-path:polygon(0% 100%,0% 58%,7% 44%,15% 55%,24% 34%,33% 50%,43% 28%,53% 45%,63% 31%,73% 48%,83% 38%,93% 54%,100% 46%,100% 100%);
  }
  .mountain.b{
    height:52%; opacity:.7; filter:blur(.3px);
    background:linear-gradient(180deg, rgba(38,70,92,.9), rgba(12,28,44,.98));
    clip-path:polygon(0% 100%,0% 52%,9% 36%,19% 52%,30% 30%,41% 48%,52% 26%,63% 44%,74% 32%,85% 50%,95% 40%,100% 50%,100% 100%);
  }
  .mist{
    position:absolute; left:-10%; right:-10%; bottom:22%; height:18%; z-index:3;
    background:radial-gradient(ellipse at center, rgba(205,235,235,.30), transparent 70%);
    filter:blur(14px);
    animation:mist-drift 15s ease-in-out infinite alternate;
  }
  /* ---------- pavilion ---------- */
  .stage{
    position:absolute; inset:0; z-index:6;
    display:grid; place-items:center;
    transform-style:preserve-3d;
    transition:transform .25s cubic-bezier(.22,.61,.36,1);
    will-change:transform;
  }
  .pavilion{
    position:relative;
    width:min(56vmin,470px); aspect-ratio:520/560;
    translate:0 -3vh;
    transform-style:preserve-3d;
    animation:pavilion-float 9s ease-in-out infinite alternate;
  }
  .hidden-symbol{position:absolute; width:0; height:0; overflow:hidden;}
  .pavilion-svg{
    position:absolute; inset:0; width:100%; height:100%; overflow:visible;
    filter: drop-shadow(0 18px 22px rgba(3,10,18,.45));
  }
  .pavilion-depth{
    position:absolute; inset:0;
    transform:translate3d(-16px,10px,-60px) scale(.97);
    opacity:.32; filter:blur(3px) brightness(.55) saturate(.7);
  }
  .pavilion-front{position:absolute; inset:0; transform:translateZ(42px);}
  .pavilion-mirror{
    position:absolute; left:-2%; right:-2%; top:calc(100% - 1vh); height:74%;
    z-index:9;
    transform-origin:top center; transform:scaleY(-1);
    opacity:.30; mix-blend-mode:screen; pointer-events:none;
    filter:blur(5px) saturate(.75) brightness(1.05);
    -webkit-mask-image:linear-gradient(0deg,transparent 0%,rgba(0,0,0,.45) 28%,#000 100%);
            mask-image:linear-gradient(0deg,transparent 0%,rgba(0,0,0,.45) 28%,#000 100%);
    animation:mirror-wave 9s ease-in-out infinite alternate;
  }
  @keyframes mirror-wave{from{transform:scaleY(-.96) skewX(-2deg) translateX(-4px)}to{transform:scaleY(-.96) skewX(2deg) translateX(4px)}}
  .pavilion-mirror svg{width:100%; height:100%; overflow:visible;}
  .pavilion-halo{
    position:absolute; inset:-10% -16% -4%;
    background:radial-gradient(ellipse at 50% 62%, rgba(255,190,115,.22), transparent 64%);
    filter:blur(22px);
    animation:lantern-pulse 7s ease-in-out infinite alternate;
  }
  /* ---------- water ---------- */
  .water{
    position:absolute; left:0; right:0; bottom:0; height:31%; z-index:5;
    background:linear-gradient(180deg, rgba(43,89,103,.88), rgba(6,20,31,.98));
  }
  .water::before{ /* moon glint */
    content:""; position:absolute; right:6%; top:-18%; width:26%; height:64%;
    background:radial-gradient(ellipse at center, rgba(255,222,155,.30), rgba(255,222,155,.06) 55%, transparent 75%);
    filter:blur(6px);
  }
  .water::after{ /* moving ripple lines */
    content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(180deg,
      rgba(215,240,245,.10) 0 3px,
      rgba(0,0,0,0) 3px 9px,
      rgba(255,255,255,.06) 9px 11px,
      rgba(0,0,0,0) 11px 20px);
    animation:ripple-flow 7s linear infinite;
  }
  /* ---------- particles ---------- */
  .fireflies,.petals{position:absolute; inset:0; z-index:7; pointer-events:none;}
  .fireflies i{
    position:absolute; display:block; border-radius:50%;
    background:#ffe9a4;
    box-shadow:0 0 12px #ffdc87,0 0 26px rgba(255,200,100,.65);
    opacity:0;
    animation:firefly 9s ease-in-out infinite;
  }
  .petals i{
    position:absolute; top:-4vh;
    background:linear-gradient(45deg,#ffd7de,#ffb3bf);
    border-radius:80% 20% 75% 25% / 65% 35% 65% 35%;
    box-shadow:0 0 8px rgba(255,190,205,.45);
    opacity:0;
    animation:petal-fall linear infinite;
  }
  /* ---------- typography ---------- */
  .title{position:absolute; left:clamp(16px,4.5vw,64px); top:clamp(18px,7vh,64px); z-index:8; user-select:none;}
  h1{
    margin:0; writing-mode:vertical-rl; line-height:1;
    font-size:clamp(36px,6.5vw,72px); letter-spacing:.18em;
    background:linear-gradient(180deg,#fff8dd,var(--gold) 58%,#b67c33);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 34px rgba(255,210,140,.22);
  }
  .title p{
    margin:14px 2px 0; max-width:15em;
    font-size:clamp(12px,1.35vw,15px); line-height:1.8; letter-spacing:.12em;
    color:rgba(255,245,218,.7);
  }
  .hint{
    position:absolute; right:22px; bottom:18px; z-index:8;
    font-size:11px; letter-spacing:.22em; color:rgba(255,244,217,.42);
  }
  /* ---------- keyframes ---------- */
  @keyframes moon-breathe{from{filter:brightness(.95)}to{filter:brightness(1.08)}}
  @keyframes mist-drift{from{transform:translateX(-30px)}to{transform:translateX(36px)}}
  @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
  @keyframes pavilion-float{from{transform:translateY(-6px) rotateY(-6deg)}to{transform:translateY(6px) rotateY(6deg)}}
  @keyframes lantern-pulse{from{opacity:.55}to{opacity:1}}
  @keyframes ripple-flow{to{background-position:0 40px}}
  @keyframes mirror-wave{from{transform:scaleY(-1) skewX(-2deg) translateX(-3px)}to{transform:scaleY(-1) skewX(2deg) translateX(3px)}}
  @keyframes firefly{
    0%,100%{opacity:0; transform:translate3d(0,0,0) scale(.5)}
    20%,70%{opacity:.95}
    50%{transform:translate3d(var(--fx,30px),var(--fy,-60px),0) scale(1)}
  }
  @keyframes petal-fall{
    0%{opacity:0; transform:translate3d(0,0,0) rotate(0) rotateY(0)}
    8%,82%{opacity:.9}
    100%{opacity:0; transform:translate3d(var(--sx,-10vw),108vh,0) rotate(660deg) rotateY(700deg)}
  }
  @media (max-width:700px){
    .pavilion{width:min(84vw,470px); translate:0 -9vh;}
    .title p{display:none;}
    h1{font-size:clamp(30px,9vw,44px);}
    .moon{right:8%; top:7%;}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition:none !important;}
  }
</style>
</head>
<body>
<main class="scene" id="scene" aria-label="月色下的中国凉亭立体场景">

  <div class="sky" aria-hidden="true">
    <div class="stars" id="stars"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="moon"></div>
  </div>

  <div class="mountains" aria-hidden="true">
    <div class="mountain a"></div>
    <div class="mountain b"></div>
  </div>
  <div class="mist" aria-hidden="true"></div>

  <div class="stage" id="stage">
    <article class="pavilion">

      <!-- shared pavilion artwork -->
      <svg class="hidden-symbol" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="roofGlaze" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2b5875"/><stop offset=".45" stop-color="#79c1c4"/><stop offset="1" stop-color="#ecd08d"/>
          </linearGradient>
          <linearGradient id="colWood" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#5d100b"/><stop offset=".35" stop-color="#e2745c"/><stop offset=".65" stop-color="#a8281f"/><stop offset="1" stop-color="#57100f"/>
          </linearGradient>
          <linearGradient id="goldLight" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff4cf"/><stop offset=".55" stop-color="#e9c26a"/><stop offset="1" stop-color="#97661f"/>
          </linearGradient>
          <radialGradient id="interiorGlow" cx=".5" cy=".5" r=".65">
            <stop offset="0" stop-color="#ffd694" stop-opacity=".95"/><stop offset="1" stop-color="#ff9c50" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="lanternRed" cx=".38" cy=".32" r=".9">
            <stop offset="0" stop-color="#ff8a65"/><stop offset=".55" stop-color="#d63a2a"/><stop offset="1" stop-color="#8d1f14"/>
          </radialGradient>
          <linearGradient id="stoneA" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#b9ac9d"/><stop offset="1" stop-color="#8d8175"/>
          </linearGradient>
          <linearGradient id="stoneB" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#9b8f82"/><stop offset="1" stop-color="#6e655c"/>
          </linearGradient>
          <pattern id="balusters" width="24" height="48" patternUnits="userSpaceOnUse">
            <rect x="10" y="0" width="4" height="48" fill="#7d241a"/>
          </pattern>

          <g id="tip-u">
            <path d="M0 0 q-9 -1 -7 -10" fill="none" stroke="#b3271d" stroke-width="3" stroke-linecap="round"/>
            <circle r="4.5" fill="#b3271d" stroke="#ffdf9d" stroke-width="1.2"/>
          </g>
          <g id="tip-l">
            <path d="M0 0 q-9 -1 -7 -10" fill="none" stroke="#b3271d" stroke-width="3.4" stroke-linecap="round"/>
            <circle r="5.2" fill="#b3271d" stroke="#ffdf9d" stroke-width="1.4"/>
          </g>

          <g id="upper-roof-l">
            <path d="M258 62 C226 108 206 150 148 178 Q132 183 122 171 L124 183 C198 162 224 122 258 204 Z" fill="url(#roofGlaze)"/>
            <path d="M258 62 C226 108 206 150 148 178 Q132 183 122 171" fill="none" stroke="#fff3c4" stroke-width="3" stroke-linecap="round" opacity=".55"/>
            <path d="M258 62 C240 96 228 128 206 154 L214 158 C236 132 248 98 262 66 Z" fill="#ffffff" opacity=".10"/>
          </g>

          <g id="lower-roof-l">
            <path d="M258 226 C218 244 164 260 92 286 Q74 291 64 279 L66 291 C160 272 214 258 258 330 Z" fill="url(#roofGlaze)"/>
            <path d="M258 226 C218 244 164 260 92 286 Q74 291 64 279" fill="none" stroke="#fff3c4" stroke-width="3.4" stroke-linecap="round" opacity=".55"/>
            <path d="M256 228 C232 240 204 248 172 258 L176 266 C208 256 236 248 258 238 Z" fill="#ffffff" opacity=".09"/>
          </g>

          <g id="lantern-l">
            <path d="M150 284 v46" stroke="#5d100b" stroke-width="2"/>
            <circle cx="150" cy="352" r="26" fill="url(#interiorGlow)" opacity=".75"/>
            <rect x="141" y="330" width="18" height="8" rx="2" fill="url(#goldLight)"/>
            <ellipse cx="150" cy="354" rx="15" ry="19" fill="url(#lanternRed)"/>
            <path d="M143 340 q-3 14 0 28 M157 340 q3 14 0 28" fill="none" stroke="#7d150c" stroke-width="1" opacity=".65"/>
            <rect x="143" y="371" width="14" height="6" rx="2" fill="url(#goldLight)"/>
            <path d="M150 377 v14" stroke="url(#goldLight)" stroke-width="2"/>
            <path d="M145 391 h10 l-5 10 Z" fill="#e9c26a"/>
          </g>

          <symbol id="pavilion-art" viewBox="0 0 520 560" overflow="visible">
            <!-- ground shadow -->
            <ellipse cx="260" cy="522" rx="212" ry="16" fill="#06121c" opacity=".35"/>

            <!-- stone platform and steps -->
            <rect x="84" y="470" width="352" height="26" fill="url(#stoneA)"/>
            <rect x="84" y="470" width="352" height="5" fill="#d8ccbc" opacity=".5"/>
            <rect x="104" y="496" width="312" height="12" fill="url(#stoneB)"/>
            <rect x="124" y="508" width="272" height="12" fill="#655c52"/>

            <!-- warm interior light -->
            <ellipse cx="260" cy="398" rx="126" ry="78" fill="url(#interiorGlow)"/>

            <!-- railing -->
            <rect x="124" y="411" width="272" height="38" fill="url(#balusters)" opacity=".95"/>
            <rect x="124" y="404" width="272" height="7" rx="3" fill="#7d241a"/>
            <rect x="124" y="428" width="272" height="5" fill="#8d2b1f"/>
            <rect x="124" y="449" width="272" height="7" rx="3" fill="#7d241a"/>
            <rect x="124" y="404" width="8" height="52" fill="#6d150f"/>
            <rect x="388" y="404" width="8" height="52" fill="#6d150f"/>

            <!-- columns -->
            <rect x="112" y="330" width="13" height="140" rx="4" fill="url(#colWood)"/>
            <rect x="207" y="330" width="13" height="140" rx="4" fill="url(#colWood)"/>
            <rect x="301" y="330" width="13" height="140" rx="4" fill="url(#colWood)"/>
            <rect x="396" y="330" width="13" height="140" rx="4" fill="url(#colWood)"/>
            <rect x="109" y="462" width="19" height="10" rx="2" fill="#57100f"/>
            <rect x="204" y="462" width="19" height="10" rx="2" fill="#57100f"/>
            <rect x="298" y="462" width="19" height="10" rx="2" fill="#57100f"/>
            <rect x="393" y="462" width="19" height="10" rx="2" fill="#57100f"/>
            <rect x="100" y="318" width="30" height="10" rx="3" fill="#6d150f"/>
            <rect x="195" y="318" width="30" height="10" rx="3" fill="#6d150f"/>
            <rect x="290" y="318" width="30" height="10" rx="3" fill="#6d150f"/>
            <rect x="384" y="318" width="30" height="10" rx="3" fill="#6d150f"/>

            <!-- gold seal plaque -->
            <rect x="233" y="336" width="54" height="64" rx="4" fill="#7d1d14" stroke="url(#goldLight)" stroke-width="2"/>
            <circle cx="260" cy="368" r="16" fill="none" stroke="url(#goldLight)" stroke-width="3"/>
            <circle cx="260" cy="368" r="6" fill="url(#goldLight)"/>

            <!-- lintel beam with gold end caps -->
            <rect x="96" y="306" width="328" height="20" fill="url(#colWood)"/>
            <rect x="96" y="306" width="328" height="5" fill="#ffbd90" opacity=".35"/>
            <rect x="96" y="321" width="328" height="5" fill="#57100f" opacity=".6"/>
            <rect x="86" y="302" width="18" height="28" rx="4" fill="url(#goldLight)"/>
            <rect x="416" y="302" width="18" height="28" rx="4" fill="url(#goldLight)"/>

            <!-- centre drum carrying upper roof -->
            <rect x="242" y="198" width="36" height="32" rx="3" fill="url(#colWood)"/>
            <rect x="242" y="204" width="36" height="6" fill="url(#goldLight)"/>

            <!-- lower centre ridge -->
            <path d="M260 234 V304" stroke="url(#goldLight)" stroke-width="4" opacity=".85" stroke-linecap="round"/>

            <!-- lanterns -->
            <use href="#lantern-l"/>
            <use href="#lantern-l" transform="translate(520,0) scale(-1,1)"/>

            <!-- lower roof -->
            <use href="#lower-roof-l"/>
            <use href="#lower-roof-l" transform="translate(520,0) scale(-1,1)"/>
            <use href="#tip-l" transform="translate(62,277)"/>
            <use href="#tip-l" transform="translate(458,277) scale(-1,1)"/>

            <!-- upper roof -->
            <use href="#upper-roof-l"/>
            <use href="#upper-roof-l" transform="translate(520,0) scale(-1,1)"/>
            <use href="#tip-u" transform="translate(122,169)"/>
            <use href="#tip-u" transform="translate(398,169) scale(-1,1)"/>

            <!-- upper centre ridge + finial -->
            <path d="M260 60 V204" stroke="url(#goldLight)" stroke-width="5" opacity=".9" stroke-linecap="round"/>
            <path d="M260 8 L269 32 L260 52 L251 32 Z" fill="url(#goldLight)"/>
            <circle cx="260" cy="10" r="9" fill="#fff2c8"/>
            <circle cx="260" cy="10" r="18" fill="#ffd98d" opacity=".22"/>
            <circle cx="260" cy="54" r="6" fill="url(#goldLight)"/>
          </symbol>
        </defs>
      </svg>

      <div class="pavilion-halo" aria-hidden="true"></div>
      <div class="pavilion-depth" aria-hidden="true">
        <svg class="pavilion-svg" viewBox="0 0 520 560" preserveAspectRatio="xMidYMax meet"><use href="#pavilion-art"/></svg>
      </div>
      <div class="pavilion-front">
        <svg class="pavilion-svg" viewBox="0 0 520 560" preserveAspectRatio="xMidYMax meet"><use href="#pavilion-art"/></svg>
      </div>
      <div class="pavilion-mirror" aria-hidden="true">
        <svg viewBox="0 0 520 560" preserveAspectRatio="xMidYMin meet"><use href="#pavilion-art"/></svg>
      </div>

    </article>
  </div>

  <section class="water" aria-hidden="true"></section>
  <div class="fireflies" id="fireflies" aria-hidden="true"></div>
  <div class="petals" id="petals" aria-hidden="true"></div>

  <header class="title">
    <h1>月下水榭</h1>
    <p>飞檐叠翠 · 朱柱映波<br />移动指针，从不同角度欣赏这座湖心亭。</p>
  </header>
  <span class="hint">POINTER PARALLAX</span>
</main>

<script>
  const scene = document.getElementById("scene");
  const stage = document.getElementById("stage");
  let targetX = 0, targetY = 0, currentX = 0, currentY = 0;

  scene.addEventListener("pointermove", event => {
    const rect = scene.getBoundingClientRect();
    targetX = ((event.clientX - rect.left) / rect.width - .5) * 2;
    targetY = ((event.clientY - rect.top) / rect.height - .5) * 2;
  });
  scene.addEventListener("pointerleave", () => { targetX = 0; targetY = 0; });

  (function animate() {
    currentX += (targetX - currentX) * .06;
    currentY += (targetY - currentY) * .06;
    stage.style.transform =
      `rotateY(${(currentX * 10).toFixed(3)}deg) rotateX(${(-currentY * 6).toFixed(3)}deg)` +
      ` translate3d(${(currentX * 14).toFixed(1)}px, ${(currentY * 8).toFixed(1)}px, 0)`;
    requestAnimationFrame(animate);
  })();

  const rand = (min, max) => min + Math.random() * (max - min);

  // stars
  const stars = document.getElementById("stars");
  for (let i = 0; i < 70; i++) {
    const star = document.createElement("i");
    const size = rand(1, 2.6);
    star.style.left = rand(0, 100) + "%";
    star.style.top = rand(0, 52) + "%";
    star.style.width = star.style.height = size + "px";
    star.style.animationDelay = rand(0, 4) + "s";
    star.style.opacity = rand(.3, .9);
    stars.appendChild(star);
  }

  // fireflies
  const fireflies = document.getElementById("fireflies");
  for (let i = 0; i < 24; i++) {
    const fly = document.createElement("i");
    const size = rand(4, 7);
    fly.style.left = rand(6, 94) + "%";
    fly.style.top = rand(30, 72) + "%";
    fly.style.width = fly.style.height = size + "px";
    fly.style.setProperty("--fx", rand(-40, 40).toFixed(0) + "px");
    fly.style.setProperty("--fy", rand(-80, -30).toFixed(0) + "px");
    fly.style.animationDelay = rand(0, 9) + "s";
    fly.style.animationDuration = rand(6, 12) + "s";
    fireflies.appendChild(fly);
  }

  // petals
  const petals = document.getElementById("petals");
  for (let i = 0; i < 30; i++) {
    const petal = document.createElement("i");
    const size = rand(9, 16);
    petal.style.left = rand(0, 100) + "%";
    petal.style.width = size + "px";
    petal.style.height = size * 1.35 + "px";
    petal.style.filter = `hue-rotate(${rand(-18, 18).toFixed(0)}deg)`;
    petal.style.setProperty("--sx", rand(-14, 4).toFixed(0) + "vw");
    petal.style.animationDelay = rand(0, 14) + "s";
    petal.style.animationDuration = rand(9, 18) + "s";
    petals.appendChild(petal);
  }
</script>
</body>
</html>
