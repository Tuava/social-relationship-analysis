name: Verify and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/check-source.py
      - run: find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sra
          POSTGRES_PASSWORD: ci-database-only
          POSTGRES_DB: sra_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sra -d sra_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Tests and vet (no real accounts or data)
        working-directory: backend
        run: |
          go mod verify
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
          go vet ./...
          go test -race -count=1 -timeout=5m ./...
          go build -trimpath -o server ./cmd/server
          go build -trimpath -o mcp-server ./cmd/mcp
          go build -trimpath ./cmd/backfill_text_window
          go build -trimpath ./cmd/init_prompts
      - name: Fresh database, authentication and restart smoke test
        env:
          DATABASE_URL: postgres://sra:ci-database-only@127.0.0.1:5432/sra_ci?sslmode=disable
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ci-admin-password-only
          JWT_SECRET: ci-jwt-secret-not-a-production-credential
          SRA_CONFIG_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          OBJECT_ROOT: ${{ runner.temp }}/sra-objects
        run: bash scripts/ci-smoke.sh
      - name: Database regression tests
        working-directory: backend
        env:
          SRA_TEST_DATABASE_URL: postgres://sra:ci-database-only@127.0.0.1:5432/sra_ci?sslmode=disable
        run: go test -race -count=1 ./internal/normalization ./internal/mcp ./internal/bot
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run test:unit
          npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
  qzone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: integrations/onebot-qzone/package-lock.json
      - working-directory: integrations/onebot-qzone
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run test:unit
          npm run build
          npm run build:plugin
  package:
    needs: [source, backend, frontend, qzone]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Build portable release
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: bash scripts/build-release.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sra-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*.tar.gz
          if-no-files-found: error
  package-smoke:
    needs: [package]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sra
          POSTGRES_PASSWORD: ci-package-only
          POSTGRES_DB: sra_package
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sra -d sra_package"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sra-linux-amd64
      - name: Run the downloaded archive without Go or npm
        run: |
          tar -xzf sra-linux-amd64.tar.gz
          cd sra-linux-amd64
          ./scripts/configure-release.sh
          sed -i 's|^DATABASE_URL=.*|DATABASE_URL=postgres://sra:ci-package-only@127.0.0.1:5432/sra_package?sslmode=disable|' backend/.env
          ./scripts/run-release.sh > "$RUNNER_TEMP/package.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then cat "$RUNNER_TEMP/package.log"; exit 1; fi
            sleep 1
          done
          [ "$ready" = 1 ] || { cat "$RUNNER_TEMP/package.log"; exit 1; }
          curl -fsS http://127.0.0.1:8000/login | grep -q '<html'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/accounts)" = 401
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"1"}}}' | ./scripts/mcp-server.sh > "$RUNNER_TEMP/mcp.json"
          python3 -c 'import json,sys; r=json.loads(open(sys.argv[1]).readline()); assert "result" in r and r["id"] == 1' "$RUNNER_TEMP/mcp.json"
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sra-*
          path: release
          merge-multiple: true
      - name: Publish verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum *.tar.gz > SHA256SUMS
          gh release create "$TAG" *.tar.gz SHA256SUMS --verify-tag --prerelease --title "SRA $TAG" --notes-file ../docs/release-notes.md
